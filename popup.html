<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; margin: 0; padding: 14px; width: 260px; color: #1f1f1f; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px; margin: 10px 0 0; }
      legend { color: #666; font-size: 12px; }
      small { color: #666; display: block; }
      @media (prefers-color-scheme: dark) {
        body { background: #202124; color: #e8eaed; }
        fieldset { border-color: #444; }
        legend, small { color: #9aa0a6; }
      }
    </style>
  </head>
  <body>
    <h1>KeepTab</h1>
    <label><input type="checkbox" id="enabled" /> Keep pinned tabs in place</label>
    <label>
      <input type="checkbox" id="preventClose" />
      <span>Don't let pinned tabs close<small>Unpin first (right-click → Unpin) to close one</small></span>
    </label>
    <fieldset>
      <legend>Open in a new tab when…</legend>
      <label>
        <input type="radio" name="scope" value="all" />
        <span>Any page change<small>Searches, links, forms on the same site too</small></span>
      </label>
      <label>
        <input type="radio" name="scope" value="cross-site" />
        <span>Leaving the site<small>Same-site navigation stays in the pin</small></span>
      </label>
    </fieldset>
    <script src="popup.js"></script>
  </body>
</html>
